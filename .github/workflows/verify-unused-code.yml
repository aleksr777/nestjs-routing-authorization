name: Verify unused-code cleanup

on:
  push:
    branches:
      - cleanup-unused-code

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript unused symbols
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters --pretty false
      - name: Knip unused code
        run: npx --yes knip@5 -c knip.audit.json --reporter compact --exclude binaries
