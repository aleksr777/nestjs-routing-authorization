name: Apply safe audit lock fixes

on:
  push:
    branches:
      - security/dependency-hardening
    paths:
      - .github/workflows/audit-fix-lock.yml

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking production audit fixes
        run: npm audit fix --package-lock-only --omit=dev

      - name: Commit package lock
        run: |
          if git diff --quiet package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Apply safe production audit fixes"
          git push
