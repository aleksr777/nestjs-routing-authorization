name: Prepare Helmet lockfile

on:
  push:
    branches:
      - security/production-http-hardening

permissions:
  contents: write

jobs:
  update-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[skip helmet lock]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: security/production-http-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update Helmet dependency and lockfile
        run: npm install helmet@8.3.0 --save --package-lock-only

      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add Helmet dependency [skip helmet lock]"
          git push
