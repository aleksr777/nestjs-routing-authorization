name: Temporary dependency cleanup

on:
  push:
    branches:
      - cleanup-unused-code

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: cleanup-unused-code

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove unused dependencies
        run: npm uninstall @nestjs/mapped-types @nestjs/swagger @eslint/eslintrc @types/cron source-map-support ts-loader --package-lock-only

      - name: Declare dotenv directly
        run: npm install dotenv --package-lock-only

      - name: Install cleaned dependency graph
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Commit lockfile cleanup
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Remove unused backend dependencies"
          git push origin HEAD:cleanup-unused-code
